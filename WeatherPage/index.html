<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather Dashboard</title>
    <link rel="stylesheet" href="index.css">
    <script src="index.js" defer></script>
</head>

<body>
    <div class="search-bar">
        <input type="search" name="search" id="search" placeholder="Search your city...">
        <button class="location-button" type="button" id="use-location-button"> Use my location</button>
        <button class="search-logo" type="button" aria-label="Search weather">🔍</button>
    </div>

    <div class="weather-dashboard" id="weather-dashboard">
        <div class="empty-state" id="empty-state">
            <p>Search a city to start</p>
        </div>

        <section class="main-panel">
            <div class="location">
                <h2 id="city-name"></h2>
                <p id="date-time"></p>
            </div>

            <div class="current-weather">
                <div class="weather-summary">
                    <div class="weather-icon" id="weather-icon"></div>
                    <div class="temperature-block">
                        <h1 id="temperature"></h1>
                    </div>
                    <div class="condition-block">
                        <h2 id="condition"></h2>
                        <p id="high-low"></p>
                    </div>
                </div>
            </div>

            <div class="forecast">
                <h3>5-Day Forecast</h3>
                <div class="forecast-grid"></div>
            </div>

            <div class="chart">
                <canvas id="tempChart"></canvas>
            </div>
        </section>

        <aside class="info-panel">
            <div class="card visibility-card">
                <div class="card-header">
                    <h4>Visibility</h4>
                </div>
                <div class="card-value">
                    <strong id="visibility"></strong>
                    <span>km</span>
                </div>
                <p class="status" id="visibility-status"></p>

                <div class="visibility-bars">
                    <span></span>
                    <span></span>
                    <span></span>
                    <span></span>
                    <span></span>
                </div>
            </div>
            <div class="card">
                <h4>Pressure</h4>
                <p id="pressure"></p>
            </div>
            <div class="card">
                <h4>AQI</h4>
                <p id="aqi"></p>
            </div>
            <div class="card">
                <h4>UV Index</h4>
                <p id="uv"></p>
            </div>
            <div class="card">
                <h4>Wind</h4>
                <p id="wind"></p>
            </div>
            <div class="card">
                <h4>Humidity</h4>
                <p id="humidity"></p>
            </div>
        </aside>
    </div>
</body>

</html>
