<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Sample Checkout</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="container mt-5">

  <div class="row">
    <div class="col-md-6 offset-md-3">
      <h2 class="mb-4 text-center">🛒 Sample Checkout</h2>

      <form id="checkoutForm" class="card shadow-sm">
        <div class="card-header bg-success text-white">
          Checkout Form
        </div>
        <div class="card-body">
          <div class="mb-3">
            <label class="form-label">Product</label>
            <select class="form-select" id="product">
              <option value="1" data-price="500">Book - KES 500</option>
              <option value="2" data-price="1500">Headphones - KES 1500</option>
              <option value="3" data-price="2500">Shoes - KES 2500</option>
            </select>
          </div>

          <div class="mb-3">
            <label for="phone" class="form-label">M-Pesa Phone Number</label>
            <input type="text" id="phone" class="form-control" placeholder="2547XXXXXXXX" required>
          </div>

          <div class="mb-3">
            <label for="amount" class="form-label">Amount (KES)</label>
            <input type="number" id="amount" class="form-control" value="500" required>
          </div>

          <button type="submit" id="submitButton" class="btn btn-success w-100">Pay with M-Pesa</button>
        </div>
      </form>

      <div id="response" class="mt-4 alert d-none"></div>
    </div>
  </div>

  <script>
    const productSelect = document.getElementById("product");
    const amountInput = document.getElementById("amount");
    const responseDiv = document.getElementById("response");
    const submitButton = document.getElementById("submitButton");
    const checkoutForm = document.getElementById("checkoutForm");

    function setSubmitting(isSubmitting) {
      submitButton.disabled = isSubmitting;
      submitButton.classList.toggle("disabled", isSubmitting);
      submitButton.classList.toggle("btn-outline-success", isSubmitting);
      submitButton.classList.toggle("opacity-75", isSubmitting);
      submitButton.innerText = isSubmitting ? "Request sent..." : "Pay with M-Pesa";
    }

    productSelect.addEventListener("change", () => {
      const selectedOption = productSelect.options[productSelect.selectedIndex];
      amountInput.value = selectedOption.getAttribute("data-price");
    });

    checkoutForm.addEventListener("submit", async (e) => {
      e.preventDefault();

      if (submitButton.disabled) return;

      setSubmitting(true);
      responseDiv.className = "mt-4 alert alert-info";
      responseDiv.innerText = "⏳ Sending your payment request...";
      responseDiv.classList.remove("d-none");

      const phone = document.getElementById("phone").value;
      const amount = Number.parseInt(document.getElementById("amount").value, 10);
      const productId = productSelect.value;

      try {
        const res = await fetch("/stkpush", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ phone, amount, productId })
        });

        if (!res.ok) {
          responseDiv.className = "mt-4 alert alert-danger";
          responseDiv.innerText = "❌ Payment request failed. Please try again.";
          responseDiv.classList.remove("d-none");
          setSubmitting(false);
          return;
        }

        const data = await res.json();

        if (data.ResponseCode === "0") {
          responseDiv.className = "mt-4 alert alert-success";
          responseDiv.innerText = "✅ Payment request sent successfully! Check your phone.";
        } else {
          responseDiv.className = "mt-4 alert alert-danger";
          responseDiv.innerText = "❌ Payment request failed. " + (data.errorMessage || "Please try again.");
        }
        responseDiv.classList.remove("d-none");

      } catch (err) {
        responseDiv.className = "mt-4 alert alert-danger";
        responseDiv.innerText = "❌ Network error. Please check your connection.";
        responseDiv.classList.remove("d-none");
      } finally {
        setSubmitting(false);
      }
    });
  </script>
</body>

</html>
